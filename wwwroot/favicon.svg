<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rpFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rpFaviconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rpFaviconIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="rpFaviconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="rpFaviconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="rpFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Indigo Glowing Border -->
  <rect width="128" height="128" rx="28" fill="url(#rpFaviconBg)"/>
  <circle cx="64" cy="64" r="48" fill="url(#rpFaviconAura)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#rpFaviconBorder)" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- RemindPe Brand Monogram: Rupee (₹) + R + Settlement Arrow + Notification Beacon -->
  <g filter="url(#rpFaviconGlow)">
    <!-- Top Rupee Bar -->
    <rect x="32" y="30" width="56" height="8" rx="4" fill="url(#rpFaviconIcon)"/>
    <!-- Second Rupee Bar -->
    <rect x="32" y="45" width="46" height="8" rx="4" fill="url(#rpFaviconIcon)"/>
    <!-- Vertical Backbone -->
    <rect x="42" y="30" width="8" height="66" rx="4" fill="url(#rpFaviconIcon)"/>
    <!-- Upper Loop (R & Rupee fusion) -->
    <path d="M46 34 H68 C80 34 82 60 68 60 H46" stroke="url(#rpFaviconIcon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Dynamic Payment Forward Slash (Emerald) -->
    <path d="M56 58 L86 94" stroke="url(#rpFaviconAccent)" stroke-width="9" stroke-linecap="round"/>
    <!-- Active Live Reminder Pulse Beacon -->
    <circle cx="96" cy="30" r="5.5" fill="url(#rpFaviconAccent)"/>
    <circle cx="96" cy="30" r="9.5" stroke="#34d399" stroke-width="1.8" stroke-dasharray="2 3" stroke-opacity="0.8"/>
  </g>
</svg>
