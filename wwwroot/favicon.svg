<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rpBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rpBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="rpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="34" fill="url(#rpBgGrad)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="32.5" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Brand Symbol: Rupee + Ledger + Recovery Arrow -->
  <g filter="url(#rpGlow)">
    <!-- Ledger Spine & Background Panel -->
    <path d="M34 26 C34 22.68 36.68 20 40 20 L86 20 C90.4 20 94 23.6 94 28 L94 100 C94 104.4 90.4 108 86 108 L40 108 C36.68 108 34 105.32 34 102 Z" fill="#1e293b" opacity="0.65"/>
    
    <!-- Stylized Rupee Stroke (₹) in Gradient -->
    <path d="M44 38 L78 38" stroke="url(#rpBrandGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M44 50 L74 50" stroke="url(#rpBrandGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M56 38 C72 38 72 62 56 62 L46 62" stroke="url(#rpBrandGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- Recovery Dynamic Diagonal Arrow -->
    <path d="M50 62 L74 96" stroke="url(#rpBrandGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Verified Payment Pulse Dot -->
    <circle cx="86" cy="88" r="9" fill="#10b981"/>
    <path d="M82 88 L85 91 L90 85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
